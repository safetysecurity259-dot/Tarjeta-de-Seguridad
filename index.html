<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tarjeta de Seguridad — PPS</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🦺%3C/text%3E%3C/svg%3E">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
  :root{
    --rojo:#c0272d; --rojo-osc:#8a1519; --amarillo:#ffdb00;
    --gris:#f5f6f7; --texto:#1a1a1a; --borde:#d8dce0;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; font-family:'Segoe UI', Arial, sans-serif; background:var(--gris); color:var(--texto);
    padding-bottom:80px;
  }
  header{
    background:var(--rojo); color:#fff; padding:14px 18px; display:flex; align-items:center; gap:12px;
    position:sticky; top:0; z-index:10; box-shadow:0 2px 6px rgba(0,0,0,.15);
  }
  header .logo{
    width:44px; height:44px; background:#fff; border-radius:8px;
    display:flex; align-items:center; justify-content:center; padding:4px; flex-shrink:0;
  }
  header .logo img{width:100%; height:100%; object-fit:contain;}
  header h1{font-size:17px; margin:0; font-weight:700;}
  header .sub{font-size:14px; font-weight:700; opacity:.97; margin-top:2px; letter-spacing:.02em;}
  .folio-badge{
    margin-left:auto; background:#fff; color:var(--rojo); padding:6px 14px; border-radius:8px;
    font-size:11px; font-weight:700; text-align:center; line-height:1.3;
  }
  .folio-badge .label{display:block; font-size:9.5px; letter-spacing:.04em; opacity:.8;}
  .folio-badge .num{display:block; font-size:15px; margin-top:1px;}
  .wrap{max-width:640px; margin:0 auto; padding:14px;}
  .card{
    background:#fff; border-radius:10px; padding:16px; margin-bottom:14px;
    box-shadow:0 1px 3px rgba(0,0,0,.08); border:1px solid var(--borde);
  }
  .card h2{
    font-size:14px; text-transform:uppercase; letter-spacing:.03em; color:var(--rojo);
    margin:0 0 12px; padding-bottom:8px; border-bottom:2px solid var(--rojo);
  }
  label{display:block; font-size:12.5px; font-weight:600; margin:10px 0 4px; color:#333;}
  input[type=text], input[type=date], textarea, select{
    width:100%; padding:9px 10px; border:1px solid var(--borde); border-radius:6px;
    font-size:14px; font-family:inherit; background:#fafbfc;
  }
  textarea{min-height:60px; resize:vertical;}
  .row2{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
  .radiogrid{display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:6px;}
  .radiopill{
    display:flex; align-items:center; gap:6px; border:1px solid var(--borde); border-radius:6px;
    padding:8px 10px; font-size:13px; cursor:pointer;
  }
  .radiopill input{width:auto;}
  .radiopill.checked{border-color:var(--rojo); background:#fbeaea;}
  .checklist{display:grid; grid-template-columns:1fr 1fr; gap:6px 14px; margin-top:6px;}
  .chk{display:flex; align-items:flex-start; gap:7px; font-size:13px; padding:4px 0;}
  .chk input{margin-top:2px; width:auto;}
  .hint{font-size:11.5px; color:#777; margin-top:3px;}
  footer{
    position:fixed; bottom:0; left:0; right:0; background:#fff; border-top:1px solid var(--borde);
    padding:10px 14px; display:flex; gap:10px; z-index:10;
  }
  button{
    flex:1; padding:13px; border:none; border-radius:8px; font-size:15px; font-weight:700; cursor:pointer;
  }
  #btnEnviar{background:var(--rojo); color:#fff;}
  #btnEnviar:active{background:var(--rojo-osc);}
  #btnEnviar:disabled{background:#e0a5a7;}
  .status{font-size:12px; text-align:center; padding:6px; color:#666;}
  .status.ok{color:#1a7a3c; font-weight:600;}
  .status.error{color:var(--rojo); font-weight:600;}
  .badge-offline{
    background:#fff3cd; color:#856404; padding:8px 10px; border-radius:6px; font-size:12.5px;
    margin-bottom:10px; display:none;
  }
  .badge-offline.show{display:block;}
  .ro-field{
    width:100%; padding:9px 10px; border:1px solid var(--borde); border-radius:6px;
    font-size:14px; background:#fafbfc; min-height:38px; line-height:1.3;
    white-space:pre-wrap; word-break:break-word;
  }
  #pdfStage{width:800px; background:#f5f6f7;}
  #pdfStage header{padding:10px 16px; position:static; box-shadow:none;}
  #pdfStage .grid2{display:grid; grid-template-columns:1fr 1fr; gap:10px; align-items:start; padding:12px;}
  #pdfStage .col{display:flex; flex-direction:column; gap:10px; min-width:0;}
  #pdfStage .card{padding:10px 12px; margin:0; border-radius:8px;}
  #pdfStage .card h2{font-size:12px; margin:0 0 8px; padding-bottom:5px;}
  #pdfStage label{font-size:11px; margin:6px 0 3px;}
  #pdfStage .ro-field{padding:5px 8px; font-size:12px; min-height:26px;}
  #pdfStage .row2{gap:8px;}
  #pdfStage .checklist{gap:1px 10px; margin-top:2px;}
  #pdfStage .chk{font-size:11.5px; padding:2px 0; gap:6px;}
  #pdfStage .radiogrid{gap:5px; margin-top:2px;}
  #pdfStage .radiopill{padding:5px 8px; font-size:11.5px;}
  .queue-count{
    background:var(--rojo); color:#fff; border-radius:10px; font-size:10px; padding:1px 6px; margin-left:5px;
  }
</style>
</head>

      <div class="radiogrid" id="prioridadList"></div>
    </div>

    <div class="card">
      <h2>Acción propuesta</h2>
      <div class="checklist" id="accionPropuestaOpcionesList"></div>
    </div>
  </form>

  <div class="status" id="statusMsg"></div>
</div>

<footer>
  <button id="btnEnviar" type="button" onclick="enviarTarjeta()">Emitir tarjeta y enviar PDF</button>
</footer>

<script>
// ======= CONFIGURACIÓN =======
const BACKEND_URL = 'https://script.google.com/macros/s/AKfycbwJ_t3ziMYVSO5H0EpdOgMDdgBN9Uks97qBkFIbzXzoipQ5S7OcD1TFFWsODSruBmbq/exec';
const CODIGO_TARJETA = 'TS3101';
const QUEUE_KEY = 'ts_seguridad_queue_v1';
const LOCAL_COUNTER_KEY = 'ts_seguridad_local_hint';

const AREAS = [
  'Despacho a cliente A', 'Despacho a cliente B', 'Despacho a Regiones', 'Losa de consolidación',
  'PTW', 'MZ', 'Aduana', 'Zona embalaje tecnico', 'Reposición', 'Zona de Residuos',
  'Recepcion', 'ZDA', 'Despacho a Tienda', 'Control de acceso', 'Logitica inversa', 'ZDR',
  'Oficinas', 'Camarines', 'Baños', 'Sala de Baterias', 'Tablero electrico', 'Perimetro exterior'
];
const PASILLOS = [
  'No aplica',
  '101','102','103','104','105','106','107','108','109','110',
  '111','112','113','114','115','116',
  '124','125','126','127','128','129','130','131','132'
];
const PELIGRO_DETECTADO = [
  'Máquinas y equipos de trabajo', 'Máquinas portátiles', 'Herramientas manuales',
  'Equipos de elevación (cargas y personas)', 'Cintas transportadoras',
  'Equipo mecanizado para movimiento', 'Transpaleta manual / carros', 'Vehículos',
  'Vehículos de levante', 'Almacenamiento y acopio', 'Sustancias químicas peligrosas',
  'Instalación eléctrica y de gas', 'Incendio y explosión', 'Espacios y superficies de trabajo',
  'Escaleras, rampas y andenes', 'Vías de evacuación', 'Iluminación', 'Servicios básicos',
  'Señalización', 'Condiciones de orden y aseo', 'Condiciones climáticas', 'Instalaciones de faena'
];
const CONDICION_DETECTADA = [
  'Pallet con riesgo de caída', 'Obstrucción extintor', 'Obstrucción red húmeda',
  'Obstrucción pulsador emergencia', 'Obstrucción vía de evacuación', 'Enchufe mal estado',
  'Herramienta dañada', 'Equipo de levante con daño'
];
const CONSECUENCIA_POTENCIAL = [
  'Caída', 'Golpe', 'Corte', 'Colisión, choque o atropello', 'Atrapamiento',
  'Sobreesfuerzo', 'Incendio', 'Explosión', 'Exposición a ruido',
  'Contacto con superficie caliente', 'Contacto con químicos', 'Contacto con electricidad',
  'Proyección de partículas', 'Exposición a humo', 'Exposición a vapor',
  'Daño a equipos', 'Daño ambiental'
];
const ACCION_PROPUESTA_OPCIONES = [
  'Despeje', 'Contención de la condición', 'Eliminar la condición',
  'Sustitución del equipo/herramienta', 'Reparación', 'Demarcación', 'Señalización'
];
const PRIORIDADES = ['Alta (2d)', 'Media Alta (7d)', 'Media Baja (14d)', 'Baja (60d)'];

function buildChecklist(containerId, items, name){
  const el = document.getElementById(containerId);
  el.innerHTML = items.map((t,i) => `
    <label class="chk">
      <input type="checkbox" name="${name}" value="${t}" id="${name}_${i}">
      <span>${t}</span>
    </label>`).join('');
}
function buildRadios(containerId, items, name){
  const el = document.getElementById(containerId);
  el.innerHTML = items.map((t,i) => `
    <label class="radiopill" id="${name}_pill_${i}">
      <input type="radio" name="${name}" value="${t}" onchange="highlightPill('${name}')">
      <span>${t}</span>
    </label>`).join('');
}
function buildSelect(containerId, items, placeholder){
  const el = document.getElementById(containerId);
  el.innerHTML = `<option value="" selected disabled>${placeholder}</option>` +
    items.map(t => `<option value="${t}">${t}</option>`).join('');
}
function highlightPill(name){
  document.querySelectorAll(`input[name="${name}"]`).forEach((input,i) => {
    document.getElementById(`${name}_pill_${i}`).classList.toggle('checked', input.checked);
  });
}

buildSelect('area', AREAS, 'Selecciona un área');
buildSelect('pasillo', PASILLOS, 'Selecciona un pasillo');
buildChecklist('peligroDetectadoList', PELIGRO_DETECTADO, 'peligroDetectado');
buildChecklist('condicionDetectadaList', CONDICION_DETECTADA, 'condicionDetectada');
buildChecklist('consecuenciaPotencialList', CONSECUENCIA_POTENCIAL, 'consecuenciaPotencial');
buildChecklist('accionPropuestaOpcionesList', ACCION_PROPUESTA_OPCIONES, 'accionPropuestaOpciones');
buildRadios('prioridadList', PRIORIDADES, 'prioridad');

document.getElementById('fechaAviso').valueAsDate = new Date();

// ======= CORRELATIVO (previsualización, no oficial hasta el envío) =======
function jsonp(url){
  return new Promise((resolve, reject) => {
    const cbName = 'cb_' + Date.now() + '_' + Math.floor(Math.random()*1e6);
    const script = document.createElement('script');
    window[cbName] = (data) => { resolve(data); cleanup(); };
    script.onerror = () => { reject(new Error('network')); cleanup(); };
    function cleanup(){ delete window[cbName]; script.remove(); }
    script.src = url + (url.includes('?') ? '&' : '?') + 'callback=' + cbName;
    document.body.appendChild(script);
    setTimeout(() => { reject(new Error('timeout')); cleanup(); }, 8000);
  });
}

// El envío real (con el PDF) va por POST: un GET/JSONP no soporta un PDF en base64
// (pesa demasiado para caber en una URL). Content-Type text/plain evita el preflight
// CORS, que Apps Script no maneja por defecto.
async function postJSON(url, obj){
  const resp = await fetch(url, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify(obj)
  });
  if(!resp.ok) throw new Error('HTTP ' + resp.status);
  return resp.json();
}

async function refreshFolioPreview(){
  try{
    const data = await jsonp(`${BACKEND_URL}?action=nextCorrelativo`);
    if(data.ok){
      document.getElementById('folioBadge').textContent = data.proximo;
    }
  }catch(e){
    document.getElementById('folioBadge').textContent = 'offline';
  }
}
refreshFolioPreview();

// ======= COLA OFFLINE =======
function getQueue(){ return JSON.parse(localStorage.getItem(QUEUE_KEY) || '[]'); }
function setQueue(q){ localStorage.setItem(QUEUE_KEY, JSON.stringify(q)); updateOfflineBadge(); }
function updateOfflineBadge(){
  const q = getQueue();
  const badge = document.getElementById('offlineBadge');
  document.getElementById('queueInfo').innerHTML = q.length ? `<span class="queue-count">${q.length} pendiente(s)</span>` : '';
  badge.classList.toggle('show', q.length > 0);
}
updateOfflineBadge();

async function trySyncQueue(){
  const q = getQueue();
  if(!q.length) return;
  const remaining = [];
  for(const item of q){
    try{
      const resp = await postJSON(BACKEND_URL, item);
      // Solo se descarta el ítem si el backend confirma ok:true.
      // Si respondió ok:false, se mantiene en la cola para revisión manual.
      if(!resp.ok) remaining.push(item);
    }catch(e){
      remaining.push(item);
    }
  }
  setQueue(remaining);
}
setInterval(trySyncQueue, 30000);
window.addEventListener('online', trySyncQueue);

// ======= RECOLECCIÓN DE DATOS =======
function collectData(){
  const val = id => document.getElementById(id).value;
  const checked = name => Array.from(document.querySelectorAll(`input[name="${name}"]:checked`)).map(i=>i.value);
  const radio = name => (document.querySelector(`input[name="${name}"]:checked`)||{}).value || '';

  return {
    area: val('area'), pasillo: val('pasillo'), autorAviso: val('autorAviso'),
    fechaAviso: val('fechaAviso'), descripcionAnomalia: val('descripcionAnomalia'),
    peligroDetectado: checked('peligroDetectado'),
    otroPeligro: val('otroPeligro'), condicionDetectada: checked('condicionDetectada'),
    consecuenciaPotencial: checked('consecuenciaPotencial'),
    otroConsecuencia: val('otroConsecuencia'),
    prioridad: radio('prioridad'),
    accionPropuestaOpciones: checked('accionPropuestaOpciones')
  };
}

// ===== PDF idéntico a la app, en UNA hoja A4 =====
// Se arma una copia compacta de solo lectura (encabezado + tarjetas en 2 columnas) con lo
// que el usuario eligió/escribió, se fotografía una sola vez con html2canvas y se ajusta
// a la hoja. Si hubiera mucho texto, se reduce lo justo para que siga cabiendo en 1 página.
function construirReporte(correlativo){
  const stage = document.createElement('div');
  stage.id = 'pdfStage';
  stage.style.cssText = 'position:absolute; left:-10000px; top:0;';

  const hdr = document.querySelector('header').cloneNode(true);
  const num = hdr.querySelector('.num');
  num.removeAttribute('id');
  num.textContent = correlativo;
  stage.appendChild(hdr);

  const grid = document.createElement('div');
  grid.className = 'grid2';
  const colIzq = document.createElement('div'); colIzq.className = 'col';
  const colDer = document.createElement('div'); colDer.className = 'col';
  grid.appendChild(colIzq); grid.appendChild(colDer);
  stage.appendChild(grid);

  document.querySelectorAll('#form .card').forEach((orig, idx) => {
    const clone = orig.cloneNode(true);
    const origCtrls = orig.querySelectorAll('input, select, textarea');
    const cloneCtrls = clone.querySelectorAll('input, select, textarea');
    origCtrls.forEach((o, i) => {
      const c = cloneCtrls[i];
      if (o.type === 'checkbox' || o.type === 'radio'){
        c.checked = o.checked;
        if (o.checked) c.setAttribute('checked', '');
        return;
      }
      let txt = '';
      if (o.tagName === 'SELECT'){
        const opt = o.options[o.selectedIndex];
        txt = (opt && o.value) ? opt.text : '';
      } else if (o.type === 'date'){
        txt = o.value ? o.value.split('-').reverse().join('/') : '';
      } else {
        txt = o.value;
      }
      const div = document.createElement('div');
      div.className = 'ro-field';
      if (o.tagName === 'TEXTAREA') div.style.minHeight = '44px';
      div.textContent = txt || '\u00A0';
      c.replaceWith(div);
    });
    // Columna izquierda: Datos, Descripción, Peligro. Derecha: el resto.
    (idx < 3 ? colIzq : colDer).appendChild(clone);
  });

  document.body.appendChild(stage);
  return { stage };
}

async function generarPDF(data, correlativo){
  // Si por alguna razón html2canvas no cargó, se usa el PDF simple para no frenar el envío.
  if (typeof html2canvas === 'undefined') return generarPDFSimple(data, correlativo);

  const { jsPDF } = window.jspdf;
  const { stage } = construirReporte(correlativo);
  try{
    const canvas = await html2canvas(stage, {
      scale: 2, backgroundColor: '#f5f6f7', useCORS: true, logging: false,
      onclone: (d) => { const st = d.getElementById('pdfStage'); st.style.left = '0'; st.style.top = '0'; }
    });
    const imgW = canvas.width / 2, imgH = canvas.height / 2;

    const doc = new jsPDF({ unit: 'pt', format: 'a4', compress: true });
    const pageW = doc.internal.pageSize.getWidth();
    const pageH = doc.internal.pageSize.getHeight();
    const footer = 22;                                   // espacio para el pie
    doc.setFillColor(245, 246, 247); doc.rect(0, 0, pageW, pageH, 'F');

    // Ajuste a una sola hoja: primero a lo ancho; si no cabe a lo alto, se reduce.
    let w = pageW, h = imgH * (pageW / imgW);
    if (h > pageH - footer){ h = pageH - footer; w = imgW * (h / imgH); }
    const x = (pageW - w) / 2;
    doc.addImage(canvas.toDataURL('image/jpeg', 0.92), 'JPEG', x, 0, w, h);

    doc.setFont('helvetica', 'normal'); doc.setFontSize(7.5); doc.setTextColor(120, 120, 120);
    doc.text(`${CODIGO_TARJETA}  ·  Generado ${new Date().toLocaleString('es-CL')}`, pageW / 2, pageH - 9, { align: 'center' });
    return doc;
  }catch(e){
    console.error('Falló la captura del PDF, se usa el formato simple:', e);
    return generarPDFSimple(data, correlativo);
  }finally{
    stage.remove();
  }
}

function generarPDFSimple(data, correlativo){
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ unit: 'pt', format: 'a4' });
  const pageW = doc.internal.pageSize.getWidth();
  const pageH = doc.internal.pageSize.getHeight();
  const margin = 40;
  const contentW = pageW - margin * 2;

  const ROJO = [192, 39, 45];
  const GRIS = [245, 246, 247];
  const BORDE = [216, 220, 224];
  const TEXTO = [26, 26, 26];
  const GRIS_TEXTO = [110, 110, 110];

  let y = 0;

  function checkPageBreak(neededH){
    if (y + neededH > pageH - 40) { doc.addPage(); y = 40; }
  }

  // ===== Encabezado (misma franja roja + logo + folio que la app) =====
  const headerH = 70;
  doc.setFillColor(...ROJO);
  doc.rect(0, 0, pageW, headerH, 'F');

  try {
    const logoImg = document.querySelector('header .logo img');
    if (logoImg && logoImg.src) {
      doc.setFillColor(255, 255, 255);
      doc.roundedRect(margin, 14, 42, 42, 6, 6, 'F');
      doc.addImage(logoImg.src, 'PNG', margin + 4, 18, 34, 34);
    }
  } catch (e) { /* si no se puede leer el logo, seguimos sin él */ }

  doc.setTextColor(255, 255, 255);
  doc.setFont('helvetica', 'bold'); doc.setFontSize(16);
  doc.text('TARJETA DE SEGURIDAD', margin + 54, 34);
  doc.setFont('helvetica', 'normal'); doc.setFontSize(10.5);
  doc.text('Safety & Security', margin + 54, 49);

  const badgeW = 150, badgeH = 42, badgeX = pageW - margin - badgeW;
  doc.setFillColor(255, 255, 255);
  doc.roundedRect(badgeX, 14, badgeW, badgeH, 6, 6, 'F');
  doc.setTextColor(...ROJO);
  doc.setFont('helvetica', 'bold'); doc.setFontSize(8.5);
  doc.text('N° AVISO DE TARJETA', badgeX + badgeW / 2, 28, { align: 'center' });
  doc.setFontSize(16);
  doc.text(String(correlativo), badgeX + badgeW / 2, 46, { align: 'center' });

  y = headerH + 22;

  doc.setFont('helvetica', 'normal'); doc.setFontSize(9); doc.setTextColor(...GRIS_TEXTO);
  doc.text(`Código: ${CODIGO_TARJETA}`, margin, y);
  y += 20;

  // ===== Helpers de contenido =====
  function sectionTitle(title){
    checkPageBreak(24);
    doc.setFont('helvetica', 'bold'); doc.setFontSize(11); doc.setTextColor(...ROJO);
    doc.text(title.toUpperCase(), margin, y);
    doc.setDrawColor(...ROJO); doc.setLineWidth(1.3);
    doc.line(margin, y + 4, pageW - margin, y + 4);
    y += 18;
  }

  function metaGrid(pairs){
    const colW = contentW / 2;
    checkPageBreak(Math.ceil(pairs.length / 2) * 34);
    const startY = y;
    pairs.forEach(([label, value], i) => {
      const col = i % 2, row = Math.floor(i / 2);
      const x = margin + col * colW;
      const yy = startY + row * 34;
      doc.setFont('helvetica', 'normal'); doc.setFontSize(8.5); doc.setTextColor(...GRIS_TEXTO);
      doc.text(label.toUpperCase(), x, yy);
      doc.setFont('helvetica', 'bold'); doc.setFontSize(11); doc.setTextColor(...TEXTO);
      doc.text(String(value || '-'), x, yy + 13);
    });
    y = startY + Math.ceil(pairs.length / 2) * 34 + 8;
  }

  function paragraph(value){
    doc.setFont('helvetica', 'normal'); doc.setFontSize(10.5); doc.setTextColor(...TEXTO);
    const lines = doc.splitTextToSize(String(value || '-'), contentW);
    checkPageBreak(lines.length * 13 + 10);
    doc.text(lines, margin, y);
    y += lines.length * 13 + 16;
  }

  function chips(items, emptyText){
    const list = (items || []).filter(Boolean);
    if (!list.length){
      checkPageBreak(20);
      doc.setFont('helvetica', 'italic'); doc.setFontSize(10); doc.setTextColor(...GRIS_TEXTO);
      doc.text(emptyText || 'Sin selección', margin, y + 13);
      y += 26;
      return;
    }
    doc.setFont('helvetica', 'normal'); doc.setFontSize(9.5);
    const rowH = 20, padX = 8, gap = 6;
    let x = margin;
    checkPageBreak(rowH);
    list.forEach(text => {
      const w = doc.getTextWidth(text) + padX * 2;
      if (x + w > pageW - margin){ x = margin; y += rowH + gap; checkPageBreak(rowH); }
      doc.setFillColor(...GRIS); doc.setDrawColor(...BORDE); doc.setLineWidth(0.7);
      doc.roundedRect(x, y, w, rowH, 5, 5, 'FD');
      doc.setTextColor(...TEXTO);
      doc.text(text, x + padX, y + 13.5);
      x += w + gap;
    });
    y += rowH + 16;
  }

  // ===== Contenido =====
  metaGrid([
    ['Área', data.area], ['Pasillo', data.pasillo],
    ['Autor aviso', data.autorAviso], ['Fecha aviso', data.fechaAviso]
  ]);

  sectionTitle('Descripción anomalía');
  paragraph(data.descripcionAnomalia);

  sectionTitle('Peligro Detectado');
  chips([...(data.peligroDetectado || []), ...(data.otroPeligro ? [`Otro: ${data.otroPeligro}`] : [])]);

  sectionTitle('Condición detectada');
  chips(data.condicionDetectada || []);

  sectionTitle('Consecuencia potencial');
  chips([...(data.consecuenciaPotencial || []), ...(data.otroConsecuencia ? [`Otro: ${data.otroConsecuencia}`] : [])]);

  sectionTitle('Prioridad');
  chips(data.prioridad ? [data.prioridad] : []);

  sectionTitle('Acción propuesta');
  chips(data.accionPropuestaOpciones || []);

  // ===== Pie de página =====
  const totalPages = doc.internal.getNumberOfPages();
  for (let p = 1; p <= totalPages; p++){
    doc.setPage(p);
    doc.setFont('helvetica', 'normal'); doc.setFontSize(8); doc.setTextColor(...GRIS_TEXTO);
    doc.text(`Generado ${new Date().toLocaleString('es-CL')}  ·  Página ${p} de ${totalPages}`, margin, pageH - 20);
  }

  return doc;
}

async function enviarTarjeta(){
  const statusEl = document.getElementById('statusMsg');
  const btn = document.getElementById('btnEnviar');

  if(!document.getElementById('form').reportValidity()){
    statusEl.textContent = 'Completa los campos obligatorios.';
    statusEl.className = 'status error';
    return;
  }

  btn.disabled = true;
  statusEl.textContent = 'Emitiendo tarjeta...';
  statusEl.className = 'status';

  const data = collectData();

  // El folio oficial lo asigna el backend (con candado, al recibir el envío) para
  // evitar duplicados si dos personas emiten al mismo tiempo. Aquí el PDF se genera
  // una sola vez con un folio provisorio, y ese mismo payload sirve tanto para el
  // envío inmediato como, si falla la red, para guardarlo en la cola offline.
  statusEl.textContent = 'Generando PDF...';
  const folioPrev = document.getElementById('folioBadge').textContent.trim();
  const folioPDF = /^\d+$/.test(folioPrev) ? folioPrev : 'Pendiente';
  const doc = await generarPDF(data, folioPDF);
  statusEl.textContent = 'Emitiendo tarjeta...';
  const pdfBase64 = doc.output('datauristring').split(',')[1];
  const payload = { ...data, pdfBase64 };

  try{
    const resp = await postJSON(BACKEND_URL, payload);

    if(resp.ok){
      statusEl.textContent = `✔ Tarjeta N° ${resp.correlativo} emitida y enviada por correo.`;
      statusEl.className = 'status ok';
      document.getElementById('folioBadge').textContent = `${resp.correlativo} emitido`;
      document.getElementById('form').reset();
      document.getElementById('fechaAviso').valueAsDate = new Date();
      document.querySelectorAll('.radiopill.checked').forEach(p=>p.classList.remove('checked'));
      refreshFolioPreview();
    } else {
      // El servidor respondió, pero rechazó el envío: no es un problema de red,
      // así que no lo encolamos (reintentar lo mismo volvería a fallar).
      statusEl.textContent = `✖ El servidor rechazó el envío: ${resp.error || 'error desconocido'}`;
      statusEl.className = 'status error';
    }
  }catch(e){
    // No hubo respuesta del servidor (sin conexión, timeout, URL mal configurada):
    // se guarda en la cola local, con el PDF ya incluido, para reintentar después.
    const q = getQueue();
    q.push(payload);
    setQueue(q);
    statusEl.textContent = '⚠ Sin conexión: guardado localmente, se enviará automáticamente al recuperar señal.';
    statusEl.className = 'status error';
  }finally{
    btn.disabled = false;
  }
}

trySyncQueue();
</script>
